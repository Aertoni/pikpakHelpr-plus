name: Build

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'
      - 'package.json'
      - 'yarn.lock'
      - 'vite.config.js'
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'
      - 'package.json'
      - 'yarn.lock'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pikpakhelperplus-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
